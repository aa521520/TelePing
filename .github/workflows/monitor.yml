name: TelePing

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'setup 注册菜单并加密收集群信息；run 执行一次控制与检测'
        type: choice
        options: [setup, run]
        default: setup

permissions: {}

concurrency:
  group: teleping-monitor
  cancel-in-progress: false

env:
  ROUND_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  control:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      should_check: ${{ steps.control.outputs.should_check }}
      matrix: ${{ steps.control.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Register Chinese menu and encrypt setup information
        id: setup
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'setup'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: python -m teleping setup
      - name: Handle authorized commands and prepare private batches
        id: control
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'setup'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          BASIC_DOMAINS: ${{ secrets.BASIC_DOMAINS }}
        run: python -m teleping control
      - name: Save encrypted setup information
        if: steps.setup.outputs.setup_complete == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup-private-${{ env.ROUND_ID }}
          path: work/setup.enc
          retention-days: 1
          compression-level: 0
      - name: Save encrypted batch plan
        if: steps.control.outputs.should_check == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-${{ env.ROUND_ID }}
          path: work/plan.enc
          retention-days: 1
          compression-level: 0

  check:
    needs: control
    if: needs.control.outputs.should_check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.control.outputs.matrix || '{"batch":[0]}') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies and Chromium
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan-${{ env.ROUND_ID }}
          path: work
      - name: Check private batch
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          BATCH_ID: ${{ matrix.batch }}
        run: python -m teleping worker --batch "$BATCH_ID"
      - name: Save encrypted results only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ env.ROUND_ID }}-${{ matrix.batch }}
          path: work/worker-${{ matrix.batch }}.enc
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

  notify:
    needs: [control, check]
    if: always() && needs.control.outputs.should_check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Collect encrypted results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-${{ env.ROUND_ID }}-*
          merge-multiple: true
          path: work
      - name: Send private summary and persist encrypted state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: python -m teleping finish
