name: TelePing

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'run 执行检测；setup 更新群功能面板'
        type: choice
        options: [run, setup]
        default: run
      force:
        description: '立即完整检测一次（人工验收时勾选）'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: teleping-monitor
  cancel-in-progress: false

env:
  ROUND_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  control:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      should_check: ${{ steps.control.outputs.should_check }}
      matrix: ${{ steps.control.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Check realtime service connectivity
        env:
          REALTIME_API_URL: ${{ vars.REALTIME_API_URL }}
        run: |
          python - <<'PY'
          import os, sys, httpx
          try:
              response = httpx.get(os.environ['REALTIME_API_URL'].rstrip('/') + '/health', timeout=30, follow_redirects=False)
              print('service_health_http:', response.status_code)
              sys.exit(0 if response.status_code == 200 and response.json().get('ok') is True else 1)
          except Exception as error:
              print('service_health_transport:', type(error).__name__)
              sys.exit(1)
          PY
      - name: Update private group function panel
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'setup'
        env:
          REALTIME_API_URL: ${{ vars.REALTIME_API_URL }}
          RUNNER_API_TOKEN: ${{ secrets.RUNNER_API_TOKEN }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: python -m teleping setup
      - name: Claim realtime work and prepare private batches
        id: control
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'setup'
        env:
          REALTIME_API_URL: ${{ vars.REALTIME_API_URL }}
          RUNNER_API_TOKEN: ${{ secrets.RUNNER_API_TOKEN }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          FORCE_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
        run: |
          if [ "$FORCE_CHECK" = "true" ]; then
            python -m teleping control --force
          else
            python -m teleping control
          fi
      - name: Save encrypted batch plan
        if: steps.control.outputs.should_check == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-${{ env.ROUND_ID }}
          path: work/plan.enc
          retention-days: 1
          compression-level: 0

  check:
    needs: control
    if: needs.control.outputs.should_check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.control.outputs.matrix || '{"batch":[0]}') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies and Chromium
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan-${{ env.ROUND_ID }}
          path: work
      - name: Check private batch
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          BATCH_ID: ${{ matrix.batch }}
        run: python -m teleping worker --batch "$BATCH_ID"
      - name: Save encrypted results only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ env.ROUND_ID }}-${{ matrix.batch }}
          path: work/worker-${{ matrix.batch }}.enc
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

  notify:
    needs: [control, check]
    if: always() && needs.control.outputs.should_check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Collect encrypted plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan-${{ env.ROUND_ID }}
          path: work
      - name: Collect encrypted results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-${{ env.ROUND_ID }}-*
          merge-multiple: true
          path: work
      - name: Commit encrypted results to realtime service
        env:
          REALTIME_API_URL: ${{ vars.REALTIME_API_URL }}
          RUNNER_API_TOKEN: ${{ secrets.RUNNER_API_TOKEN }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: python -m teleping finish
