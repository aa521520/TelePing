name: Tests

on:
  push:
    branches-ignore: [teleping-state]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m playwright install --with-deps chromium
      - run: python -m ruff check teleping tests
      - run: python -m pytest -q
      - name: Test realtime service and Python encryption compatibility
        env:
          PYTHON: python
        run: node --test cloudflare/test/*.test.mjs

  test-17ce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test isolated 17CE service and payment submission fencing
        run: node --test cloudflare17ce/test/*.test.mjs scripts/test/seventeence*.test.mjs
