[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "teleping"
version = "0.1.0"
description = "Private-target website monitoring with GitHub Actions and Telegram"
requires-python = ">=3.12"
dependencies = ["cryptography>=44", "httpx>=0.28,<1", "playwright>=1.50,<2", "tldextract>=5,<6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.9", "PyYAML>=6"]

[tool.setuptools.packages.find]
include = ["teleping*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
